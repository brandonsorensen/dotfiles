set-option -g prefix C-a
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# Switch between zoomed panes.
bind -r a select-pane -t .+1 \; resize-pane -Z

set -g mouse on
set -s default-terminal "tmux-256color"
set-window-option -g aggressive-resize off
set-option -g history-limit 50000
set-option -g renumber-windows on
set -g allow-passthrough on

# Let pi and other TUIs distinguish modified keys inside tmux
# (Shift+Enter, Ctrl+Enter, Alt+Enter, etc.). Requires tmux 3.5+.
set -g extended-keys on
set -g extended-keys-format csi-u

# Notifications.
set -g bell-action any
set -g monitor-bell on

# Run project tools in the active pane's directory.
bind-key G display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "lazygit"
bind-key g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "gitui"

# Vi-style copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Shared plugins.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Optional overlays may register platform- or host-specific plugins before TPM
# initializes them.
source-file -q "$HOME/.config/tmux/platform.conf"
source-file -q "$HOME/.config/tmux/host.conf"

set -g @plugin 'erikw/tmux-dark-notify'
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM after every plugin declaration.
run "$HOME/.tmux/plugins/tpm/tpm"

unbind -n C-l
